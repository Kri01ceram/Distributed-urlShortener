services:
  postgres:
    image: postgres:17
    container_name: url-shortener-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener_password
      POSTGRES_DB: url_shortener
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: url-shortener-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  api:
    build:
      context: .
      dockerfile: Dockerfile

    expose:
      - "3000"

    environment:
      PORT: 3000

      DATABASE_URL: "postgresql://url_shortener:url_shortener_password@postgres:5432/url_shortener"

      REDIS_HOST: redis
      REDIS_PORT: 6379
    
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) })"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      - postgres
      - redis
  nginx:
    image: nginx:alpine

    ports:
      - "3000:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - api

volumes:
  postgres_data:
  redis_data: